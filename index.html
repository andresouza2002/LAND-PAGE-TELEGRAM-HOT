<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presente Exclusivo</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
}

body {
  min-height: 100vh;
  background: #14002f;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.container {
  width: 100%;
  max-width: 390px;
  height: 100vh;
  padding: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.screen {
  width: 100%;
  text-align: center;
  animation: fadeIn .5s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.gift-wrap {
  cursor: pointer;
  display: inline-block;
  transition: .25s ease;
}

.gift-wrap:active {
  transform: scale(.94);
}

.gift {
  width: 145px;
  height: 120px;
  margin: 0 auto 22px;
  position: relative;
}

.gift-box {
  position: absolute;
  bottom: 0;
  width: 140px;
  height: 88px;
  background: #ff2b7a;
  border-radius: 0 0 18px 18px;
  overflow: hidden;
  box-shadow: 0 18px 35px rgba(255, 43, 122, .22);
}

.gift-box::before {
  content: "";
  position: absolute;
  left: 60px;
  top: 0;
  width: 20px;
  height: 100%;
  background: #ffb000;
}

.gift-box::after {
  content: "";
  position: absolute;
  top: 32px;
  left: 0;
  width: 100%;
  height: 20px;
  background: #ffb000;
}

.gift-lid {
  position: absolute;
  top: 0;
  left: -5px;
  width: 150px;
  height: 50px;
  background: #ff2b7a;
  border-radius: 14px;
  z-index: 3;
}

.ribbon {
  position: absolute;
  top: -8px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 28px;
  z-index: 5;
}

h1 {
  font-size: 18px;
  font-weight: 800;
  color: #f0d7ff;
  margin-bottom: 8px;
}

p {
  font-size: 13px;
  color: rgba(255,255,255,.34);
}

#etapa2 {
  display: none;
}

.opened {
  animation: pop .45s ease;
}

@keyframes pop {
  0% { transform: scale(.85); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

.card {
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 22px;
  padding: 28px 22px;
  box-shadow: 0 25px 70px rgba(0,0,0,.35);
}

.btn {
  width: 100%;
  margin-top: 22px;
  padding: 16px;
  border: none;
  border-radius: 16px;
  background: linear-gradient(135deg, #ff2b7a, #ff8a00);
  color: white;
  font-size: 15px;
  font-weight: 900;
  cursor: pointer;
  box-shadow: 0 12px 35px rgba(255,43,122,.35);
}

.timer {
  margin-top: 13px;
  font-size: 13px;
  color: #ffd3ec;
  font-weight: 700;
}

.loading {
  margin-top: 18px;
  width: 100%;
  height: 8px;
  background: rgba(255,255,255,.1);
  border-radius: 10px;
  overflow: hidden;
  display: none;
}

.loading-bar {
  width: 0%;
  height: 100%;
  background: linear-gradient(90deg, #ff2b7a, #ffb000);
  transition: width 1.6s ease;
}

.status {
  margin-top: 10px;
  font-size: 13px;
  color: #ffd3ec;
}
</style>
</head>

<body>

<div class="container">

  <div class="screen" id="etapa1">
    <div class="gift-wrap" onclick="abrirPresente()">
      <div class="gift">
        <div class="ribbon">🎀</div>
        <div class="gift-lid"></div>
        <div class="gift-box"></div>
      </div>

      <h1>Toque para abrir</h1>
      <p>Presente exclusivo</p>
    </div>
  </div>

  <div class="screen opened" id="etapa2">
    <div class="card">
      <h1>Seu presente foi liberado 🎁</h1>

      <p>
        Uma oferta especial acabou de ficar disponível para você.
        Toque abaixo para acessar antes que expire.
      </p>

      <button class="btn" onclick="redirectFinal()">
        RESGATAR AGORA →
      </button>

      <div class="timer">
        Oferta disponível por: <span id="timer">50</span>s
      </div>

      <div class="loading" id="loading">
        <div class="loading-bar" id="loadingBar"></div>
      </div>

      <div class="status" id="status"></div>
    </div>
  </div>

</div>

<script>
let time = 50;
let interval;

function abrirPresente() {
  document.getElementById('etapa1').style.display = 'none';
  document.getElementById('etapa2').style.display = 'block';

  interval = setInterval(() => {
    time--;
    document.getElementById('timer').innerText = time;

    if (time <= 0) {
      clearInterval(interval);
      document.getElementById('timer').innerText = '0';
    }
  }, 1000);
}

function redirectFinal() {
  const loading = document.getElementById('loading');
  const bar = document.getElementById('loadingBar');
  const status = document.getElementById('status');

  loading.style.display = 'block';
  bar.style.width = '100%';

  status.innerText = 'Validando presente...';

  setTimeout(() => {
    status.innerText = 'Redirecionando...';
  }, 800);

  setTimeout(() => {
    window.location.href = 'https://tiktokshop--commerce.vercel.app/';
  }, 1600);
}
</script>

</body>
</html>
